AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CampusConnect backend on AWS: the Express API on Lambda behind API Gateway,
  users and jobs in DynamoDB, and student resumes in a private S3 bucket.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign login tokens. Use a long random string (at least 32 characters).

  AdminSetupKey:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: One-time key needed to create the first admin account.

  AllowedOrigins:
    Type: String
    Default: "*"
    Description: >
      Comma-separated frontend URLs allowed to call the API and upload resumes,
      for example https://campusconnect.vercel.app,http://localhost:5173. Use * to allow any site.

  LambdaRoleName:
    Type: String
    Default: ""
    Description: >
      Leave empty on a normal AWS account: the stack creates a role with only
      the permissions the API needs. On AWS Academy Learner Lab, which can't
      create roles, enter LabRole.

Conditions:
  CreateRole: !Equals [!Ref LambdaRoleName, ""]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15

Resources:
  # Users and their email locks. Keep in sync with backend/config/schema.js.
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: role, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: role-createdAt-index
          KeySchema:
            - { AttributeName: role, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Job postings. Keep in sync with backend/config/schema.js.
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Private bucket for resumes. Browsers upload with signed forms and read
  # with signed links that expire after 5 minutes; nothing here is public.
  ResumeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !Split [",", !Ref AllowedOrigins]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # The function's permissions on a normal AWS account: write logs, read and
  # write the two tables, and manage files under resumes/ in the bucket.
  # Not created on Learner Lab, where LambdaRoleName is LabRole.
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: campusconnect-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/index/*"
                  - !GetAtt JobsTable.Arn
                  - !Sub "${JobsTable.Arn}/index/*"
              - Sid: ResumeFiles
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${ResumeBucket.Arn}/resumes/*"
              # Lets S3 answer "not found" (404) instead of "forbidden" (403)
              # when the app checks an upload that never arrived
              - Sid: ResumeBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResumeBucket.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.handler
      Description: CampusConnect Express API
      Role: !If
        - CreateRole
        - !GetAtt ApiFunctionRole.Arn
        - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Environment:
        Variables:
          NODE_ENV: production
          USERS_TABLE: !Ref UsersTable
          JOBS_TABLE: !Ref JobsTable
          RESUME_BUCKET: !Ref ResumeBucket
          JWT_SECRET: !Ref JwtSecret
          ADMIN_SETUP_KEY: !Ref AdminSetupKey
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Events:
        Api:
          # No path or method: every request goes to Express, which does the routing
          Type: HttpApi

Outputs:
  ApiUrl:
    Description: Put this in the frontend as VITE_API_URL
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api
  UsersTableName:
    Value: !Ref UsersTable
  JobsTableName:
    Value: !Ref JobsTable
  ResumeBucketName:
    Value: !Ref ResumeBucket
